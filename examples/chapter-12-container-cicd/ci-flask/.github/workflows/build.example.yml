name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t myapp:test .

      - name: Test the image
        run: |
          trap "docker rm -f test-container 2>/dev/null || true" EXIT
          docker run -d -p 5000:5000 --name test-container myapp:test
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:5000/

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_TAG=$(git rev-parse --short HEAD)
          docker tag myapp:test ${{ secrets.DOCKER_USERNAME }}/myapp:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/myapp:$IMAGE_TAG

          # Also tag as main for branch builds
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag myapp:test ${{ secrets.DOCKER_USERNAME }}/myapp:main
            docker push ${{ secrets.DOCKER_USERNAME }}/myapp:main
          fi
