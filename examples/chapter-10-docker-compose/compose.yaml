services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"

  app:
    image: node:24-alpine
    command: sh -c "echo 'Hello from app' && tail -f /dev/null"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: example-password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
