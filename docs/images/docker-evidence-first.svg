<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Inspect first — the Docker troubleshooting workflow</title>
<desc id="desc">Four steps: docker ps -a checks container state; docker inspect checks configuration and exit code; docker logs shows application output; then test the failing workflow. Inspect evidence before changing the system.</desc>
<rect width="1440" height="940" fill="#fff"/>
<text x="720" y="70" font-family="Arial,sans-serif" font-weight="700" font-size="56" fill="#12264e" text-anchor="middle">INSPECT FIRST</text>
<text x="720" y="112" font-family="Arial,sans-serif" font-size="29" fill="#34516b" text-anchor="middle">Read the evidence before changing anything</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs>
<g><rect x="74" y="146" width="1290" height="154" rx="22" fill="#edf6ff" stroke="#2879c8" stroke-width="3"/><circle cx="74" cy="222" r="40" fill="#2879c8"/><text x="74" y="237" font-family="Arial,sans-serif" font-size="44" font-weight="700" text-anchor="middle" fill="white">1</text><text x="175" y="234" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132648">docker ps -a</text><path d="M 720 222 H 800" stroke="#2879c8" stroke-width="7" fill="none" marker-end="url(#arr)"/><text x="855" y="211" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#18304a">Which containers exist?</text><text x="855" y="255" font-family="Arial,sans-serif" font-size="29" fill="#18304a">What state are they in?</text></g>
<g><rect x="74" y="339" width="1290" height="154" rx="22" fill="#effaf3" stroke="#299363" stroke-width="3"/><circle cx="74" cy="415" r="40" fill="#299363"/><text x="74" y="430" font-family="Arial,sans-serif" font-size="44" font-weight="700" text-anchor="middle" fill="white">2</text><text x="175" y="427" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132648">docker inspect</text><path d="M 720 415 H 800" stroke="#299363" stroke-width="7" fill="none" marker-end="url(#arr)"/><text x="855" y="404" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#18304a">What is configured?</text><text x="855" y="448" font-family="Arial,sans-serif" font-size="29" fill="#18304a">What is the exit code?</text></g>
<g><rect x="74" y="532" width="1290" height="154" rx="22" fill="#fff7eb" stroke="#d78c16" stroke-width="3"/><circle cx="74" cy="608" r="40" fill="#d78c16"/><text x="74" y="623" font-family="Arial,sans-serif" font-size="44" font-weight="700" text-anchor="middle" fill="white">3</text><text x="175" y="620" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132648">docker logs</text><path d="M 720 608 H 800" stroke="#d78c16" stroke-width="7" fill="none" marker-end="url(#arr)"/><text x="855" y="597" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#18304a">What did the application output?</text><text x="855" y="641" font-family="Arial,sans-serif" font-size="29" fill="#18304a">What evidence is missing?</text></g>
<g><rect x="74" y="725" width="1290" height="154" rx="22" fill="#f7f0ff" stroke="#7952b3" stroke-width="3"/><circle cx="74" cy="801" r="40" fill="#7952b3"/><text x="74" y="816" font-family="Arial,sans-serif" font-size="44" font-weight="700" text-anchor="middle" fill="white">4</text><text x="175" y="813" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#132648">Test the failing workflow</text><path d="M 720 801 H 800" stroke="#7952b3" stroke-width="7" fill="none" marker-end="url(#arr)"/><text x="855" y="790" font-family="Arial,sans-serif" font-size="31" font-weight="600" fill="#18304a">Did the change fix the problem?</text><text x="855" y="834" font-family="Arial,sans-serif" font-size="29" fill="#18304a">Verify the original requirement</text></g>
<path d="M 720 301 V 330 M 720 494 V 523 M 720 687 V 716" stroke="#64748b" stroke-width="5" marker-end="url(#arr)"/>
</svg>